# SPDX-License-Identifier: MIT
# OpenWRT-CI-X86 云编译核心（可复用工作流）
# 流程：准备环境 → 克隆 lede 源码 → 恢复缓存 → 更新 feeds → 安装插件 → 打补丁
#       → 生成配置 → 下载源码 → 编译固件 → 保存缓存 → 打包发布
name: build-core

on:
  workflow_call:
    inputs:
      config:
        required: true
        type: string
        description: 配置片段文件名（不含 .txt，位于 Config/ 目录）
      theme:
        required: false
        type: string
        default: argon
        description: 默认 LuCI 主题
      hostname:
        required: false
        type: string
        default: OWRT
        description: 默认主机名
      lan_ip:
        required: false
        type: string
        default: 10.0.1.1
        description: 默认 LAN 管理地址
      repo:
        required: false
        type: string
        default: https://github.com/coolsnowwolf/lede.git
        description: OpenWrt 源码仓库
      branch:
        required: false
        type: string
        default: master
        description: 源码分支
      source:
        required: false
        type: string
        default: coolsnnowwolf/lede
        description: 源码名称（用于缓存与命名）
      extra_packages:
        required: false
        type: string
        default: ''
        description: 手动追加的 CONFIG_PACKAGE_* 行（每行一个）
      test:
        required: false
        type: boolean
        default: false
        description: 仅输出 .config，不编译固件

# 不声明 permissions：reusable workflow 的 GITHUB_TOKEN 权限继承调用方
# （GitHub 规则：被调用工作流权限不能超过调用方），build.yml 已声明
# contents: write + actions: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  WRT_CONFIG: ${{ inputs.config }}
  WRT_THEME: ${{ inputs.theme }}
  WRT_NAME: ${{ inputs.hostname }}
  WRT_IP: ${{ inputs.lan_ip }}
  WRT_REPO: ${{ inputs.repo }}
  WRT_BRANCH: ${{ inputs.branch }}
  WRT_SOURCE: ${{ inputs.source }}
  WRT_PACKAGE: ${{ inputs.extra_packages }}
  WRT_TEST: ${{ inputs.test }}

jobs:
  build:
    name: ${{ inputs.source }} / ${{ inputs.config }}
    runs-on: ubuntu-latest
    outputs:
      cache_prefix: ${{ steps.prepare.outputs.cache_prefix }}
      cache_key: ${{ steps.clone.outputs.cache_key }}
    steps:
      - name: 检出工作流项目
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/lib/node_modules 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          df -h

      - name: 安装编译依赖
        run: |
          sudo -E apt-get -yqq update
          sudo -E apt-get -yqq install --no-install-recommends \
            build-essential clang gcc-multilib g++-multilib flex bison gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl jq bc time qemu-utils cpio patchutils diffutils autoconf automake \
            libtool bzip2 xz-utils gzip perl uuid-runtime dos2unix
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: 初始化编译参数
        id: prepare
        run: |
          # 从配置片段解析目标平台（如 x86 / x86_64）
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?==y)' "Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[\w]+(?==y)" "Config/$WRT_CONFIG.txt")
          WRT_CACHE_PREFIX="owrt-${WRT_SOURCE//\//-}-${WRT_BRANCH//\//-}-$WRT_TARGET-$WRT_SUBTARGET"

          echo "WRT_TARGET=$WRT_TARGET" >> "$GITHUB_ENV"
          echo "WRT_SUBTARGET=$WRT_SUBTARGET" >> "$GITHUB_ENV"
          echo "WRT_DATE=$(TZ=UTC-8 date +'%y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> "$GITHUB_ENV"
          echo "WRT_KVER=none" >> "$GITHUB_ENV"
          echo "WRT_LIST=none" >> "$GITHUB_ENV"
          echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX" >> "$GITHUB_ENV"
          # 源名称形如 "coolsnnowwolf/lede"，含斜杠，用于文件名/tag 时替换为 "-"
          echo "WRT_SOURCE_FILE=${WRT_SOURCE//\//-}" >> "$GITHUB_ENV"

          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: 克隆 OpenWrt 源码
        id: clone
        run: |
          git clone -q --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./wrt
          cd ./wrt
          WRT_HASH=$(git rev-parse HEAD)
          WRT_CACHE_KEY="$WRT_CACHE_PREFIX-$WRT_HASH"
          echo "WRT_HASH=$WRT_HASH" >> "$GITHUB_ENV"
          echo "WRT_CACHE_KEY=$WRT_CACHE_KEY" >> "$GITHUB_ENV"
          echo "cache_key=$WRT_CACHE_KEY" >> "$GITHUB_OUTPUT"

          # 移除默认 helloworld feed：其 14 个代理组件与 openwrt-passwall-packages 同名，
          # 同存会导致重复包编译失败。PassWall/PassWall2 已覆盖所需功能。
          sed -i '/helloworld/d' feeds.conf.default
          echo ">> 已移除 helloworld feed（避免与 passwall-packages 同名冲突）"

      - name: 统一脚本格式
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: 恢复构建缓存
        id: cache-restore
        if: ${{ !inputs.test }}
        uses: actions/cache/restore@v4
        with:
          key: ${{ env.WRT_CACHE_KEY }}
          restore-keys: ${{ env.WRT_CACHE_PREFIX }}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: 处理恢复的构建缓存
        if: ${{ !inputs.test && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          # 恢复的缓存文件时间戳统一刷新，避免 make 误判增量
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo ">> 已恢复缓存: ${{ steps.cache-restore.outputs.cache-matched-key }}"

      - name: 更新 feeds
        run: |
          cd ./wrt
          ./scripts/feeds update -a

      - name: 移除 lede 自带 OAF（改用上游新版 OpenAppFilter）
        run: |
          # lede 自带的 open-app-filter / luci-app-appfilter 为旧版，
          # 与 packages.sh 安装的上游新版（luci-app-oaf v7）存在同名包冲突，
          # 需在 feeds install 前移除，避免 kconfig 重复符号导致编译失败。
          rm -rf ./wrt/feeds/packages/net/open-app-filter
          rm -rf ./wrt/feeds/luci/applications/luci-app-appfilter
          echo ">> 已移除 lede 自带 OAF（open-app-filter / luci-app-appfilter）"

      - name: 安装 feeds
        run: |
          cd ./wrt
          ./scripts/feeds install -a

      - name: 安装插件源码
        run: |
          cd ./wrt
          bash $GITHUB_WORKSPACE/Scripts/packages.sh

      - name: 应用源码补丁
        env:
          WRT_MARK: ${{ env.WRT_MARK }}
          WRT_DATE: ${{ env.WRT_DATE }}
        run: |
          cd ./wrt
          bash $GITHUB_WORKSPACE/Scripts/patches.sh

      - name: 生成编译配置
        run: |
          cd ./wrt
          bash $GITHUB_WORKSPACE/Scripts/settings.sh
          make defconfig -j$(nproc)
          make clean -j$(nproc)

      - name: 下载软件包源码
        if: ${{ !inputs.test }}
        run: |
          cd ./wrt
          make download -j$(nproc) || make download -j1 V=s

      - name: 编译固件
        if: ${{ !inputs.test }}
        run: |
          cd ./wrt
          make -j$(nproc) || make -j1 V=s

      - name: 保存构建缓存
        if: ${{ !inputs.test && success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: ${{ env.WRT_CACHE_KEY }}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: 机器信息
        run: |
          echo "======================="
          lscpu | grep -E "Model name|Core|Thread"
          df -h
          echo "======================="

      - name: 打包固件
        run: |
          cd ./wrt && mkdir -p ./upload
          # WRT_SOURCE_FILE 已由 prepare 步骤将 "/" 替换为 "-"
          cp -f ./.config "./upload/Config-$WRT_CONFIG-$WRT_SOURCE_FILE-$WRT_BRANCH-$WRT_DATE.txt"

          if [ "$WRT_TEST" != 'true' ]; then
            # 提取内核版本与已编译插件清单（用于发布说明）
            MANIFEST=$(find ./bin/targets/ -type f -name "*.manifest" | head -1)
            if [ -n "$MANIFEST" ]; then
              echo "WRT_KVER=$(grep -oP '^kernel - \K[\d.]+' "$MANIFEST" | head -1)" >> "$GITHUB_ENV"
              echo "WRT_LIST=$(grep -oP '^luci-(app|theme)[^ ]*' "$MANIFEST" | tr '\n' ' ')" >> "$GITHUB_ENV"
            fi

            # 复制固件产物（保留原文件名 + 校验文件），
            # 排除 packages/ 下数百个 .ipk 与无关中间文件
            find ./bin/targets/ -type f ! -path '*/packages/*' | while read -r FILE; do
              case "$FILE" in
                *.buildinfo|*.json) rm -f "$FILE" ;;
                *) cp -f "$FILE" ./upload/ ;;
              esac
            done
          fi
          ls -lh ./upload/

      - name: 发布固件
        if: ${{ success() }}
        uses: softprops/action-gh-release@v2
        with:
          # WRT_SOURCE_FILE 已由 prepare 步骤将 "/" 替换为 "-"，可直接用于 tag
          tag_name: ${{ env.WRT_CONFIG }}-${{ env.WRT_SOURCE_FILE }}-${{ env.WRT_BRANCH }}-${{ env.WRT_DATE }}
          name: ${{ env.WRT_CONFIG }} 固件 ${{ env.WRT_DATE }}
          files: ./wrt/upload/*.*
          body: |
            ## 固件信息

            - 源码：${{ env.WRT_REPO }}（分支：${{ env.WRT_BRANCH }}）
            - 提交：${{ env.WRT_HASH }}
            - 配置：${{ env.WRT_CONFIG }}
            - 平台：${{ env.WRT_TARGET }} / ${{ env.WRT_SUBTARGET }}
            - 内核版本：${{ env.WRT_KVER }}

            ## 登录信息

            - 管理地址：http://${{ env.WRT_IP }}
            - 用户名：root
            - 密码：首次登录时自行设置

            ## 已编译插件

            ${{ env.WRT_LIST }}

            ## 说明

            - 支持 BIOS/UEFI 双引导（combined / combined-efi 镜像），J1900 / J1800 等 x86_64 设备直接写入。
            - 1Panel 请通过「iStore 应用商店」在线安装（固件已内置 Docker 与 iStore）。
            - BBR 加速已由内核默认开启，TurboACC 中可直接选择 bbr 拥塞算法。

  cache-rollover:
    name: 清理旧构建缓存
    needs: build
    if: ${{ !inputs.test && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 删除同前缀的过期缓存
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 保留本次生成的缓存，删除同前缀的历史缓存，避免触碰 10GB 上限
          gh cache list --key "${{ needs.build.outputs.cache_prefix }}-" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
              [ -n "$CACHE_ID" ] || continue
              [ "$CACHE_KEY" = "${{ needs.build.outputs.cache_key }}" ] && continue
              gh cache delete "$CACHE_ID" ||
                echo "warning: 删除缓存 $CACHE_ID ($CACHE_KEY) 失败"
            done
